[package]
name = "msdevbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Microsoft Dev Box client library for Linux: Entra sign-in, workspace discovery, .rdp generation. C ABI for GUI clients (KRDC, Remmina, ...)."
repository = "https://github.com/TGMM/libmsdevbox"

[lib]
name = "msdevbox"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "msdevbox"
path = "src/bin/msdevbox.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
